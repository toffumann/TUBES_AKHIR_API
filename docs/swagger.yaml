openapi: 3.0.0
info:
  title: API Tugas Akhir
  version: 1.0.0
  description: Dokumentasi API proyek Tugas Akhir
servers:
  - url: http://localhost:3333
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        fullName:
          type: string
        email:
          type: string
    Service:
      type: object
      properties:
        id:
          type: integer
        nama_layanan:
          type: string
        deskripsi:
          type: string
        harga:
          type: integer
    Project:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        serviceId:
          type: integer
        catatanUser:
          type: string
        statusProject:
          type: string
        deadline:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        service:
          $ref: '#/components/schemas/Service'
        user:
          $ref: '#/components/schemas/User'

security:
  - bearerAuth: []

paths:
  # ===== AUTHENTICATION =====
  /register:
    post:
      summary: Registrasi user baru
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                nomorTelepon:
                  type: string
      responses:
        '200':
          description: Registrasi berhasil
  /login:
    post:
      summary: Login user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login berhasil, mengembalikan token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
                  type:
                    type: string
                  expires_in:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
  /logout:
    post:
      summary: Logout user
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout berhasil

  # ===== SERVICES =====
  /service:
    post:
      summary: Admin menambahkan service
      tags:
        - Services
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nama_layanan:
                  type: string
                deskripsi:
                  type: string
                harga:
                  type: integer
      responses:
        '200':
          description: Service berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  service:
                    $ref: '#/components/schemas/Service'
  /service/product:
    get:
      summary: Ambil semua layanan untuk user
      tags:
        - Services
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar layanan
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'

  # ===== USER PROFILE =====
  /me:
    get:
      summary: Ambil data user saat login
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Data user berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'

  # ===== PROJECT =====
  /project:
    post:
      summary: Buat project baru
      tags:
        - Project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service_id:
                  type: integer
                catatan_user:
                  type: string
      responses:
        '201':
          description: Project berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Project'

  # ===== DASHBOARD USER =====
  /dashboard/product/{id}:
    get:
      summary: Detail project user
      tags:
        - Dashboard
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detail project
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Project'
        '404':
          description: Project tidak ditemukan

  /dashboard/project:
    get:
      summary: Daftar semua project user
      tags:
        - Dashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar project user
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'

  /dashboard/update/product/{id}:
    put:
      summary: Update catatan project user
      tags:
        - Dashboard
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                catatan_user:
                  type: string
      responses:
        '200':
          description: Project berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Project'
        '404':
          description: Project tidak ditemukan

  # ===== PAYMENT =====
  /payment/{id}:
    post:
      summary: Buat transaksi Midtrans
      tags:
        - Payment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Berhasil membuat transaksi
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapToken:
                    type: string
                  redirectUrl:
                    type: string

  /midtrans/webhook:
    post:
      summary: Update status pembayaran via webhook
      tags:
        - Payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id:
                  type: string
                transaction_status:
                  type: string
      responses:
        '200':
          description: Status pembayaran berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
